# pnyx asset media — static variant tree, fronted by Cloudflare.
#
# URL   /{fingerprint}/256.webp         fingerprint = CIP-14 `asset1…` (44 chars)
# Disk  /srv/pnyx-media/v1/{shard}/{fingerprint}.256.webp     shard = fingerprint[6:8]
#
# The location regex is the bech32 alphabet, so it doubles as validation: a path
# that is not a well-formed fingerprint never reaches the filesystem.

open_file_cache          max=50000 inactive=120s;
open_file_cache_valid    300s;
open_file_cache_min_uses 1;
open_file_cache_errors   on;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    sendfile   on;
    tcp_nopush on;
    gzip       off;   # webp is already compressed

    access_log /var/log/nginx/pnyx-media.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/pnyx-media.error.log warn;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    # asset1 + 2-char shard + 36 more = 44 chars total.
    location ~ "^/asset1(?<sh>[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{2})(?<rest>[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{36})/256\.webp$" {
        alias /srv/pnyx-media/v1/$sh/asset1$sh$rest.256.webp;
        default_type image/webp;
        # An asset's image is immutable: the fingerprint IS the content identity.
        #
        # ⚠️ NO `always` — deliberately. `always` also stamps this onto the 404 nginx
        # returns when the file is absent, and Cloudflare honours it: a miss would be
        # cached at the edge for a year, so an asset the backfill later fills in would
        # keep answering 404 until the TTL expired. Coverage grows continuously, so a
        # miss must stay cheap to re-ask. Without `always` this lands on 2xx/3xx only
        # and a 404 falls back to Cloudflare's 3-minute default.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Pnyx-Media "v1" always;
        access_log off;
    }

    # Right shape, wrong case: bech32 is lowercase-only, so this is a client bug,
    # not a missing asset. Answering 400 keeps the two distinguishable in logs.
    location ~* "^/asset1[qpzry9x8gf2tvdw0s3jn54khce6mua7lQPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{38}/256\.webp$" {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 400 "asset media fingerprints are lowercase bech32\n";
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
