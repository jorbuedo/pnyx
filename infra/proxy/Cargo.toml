[package]
name = "pnyx-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = {version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "fs"]}
hyper = {version = "1", features = ["server", "client", "http1"]}
hyper-util = {version = "0.1", features = ["tokio", "client-legacy", "http1"]}
hyper-rustls = {version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"]}
http-body-util = "0.1"
rustls = {version = "0.23", default-features = false, features = ["ring", "std", "tls12"]}
bytes = "1"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
