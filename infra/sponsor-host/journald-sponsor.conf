# Journal retention for the sponsor host. Installed to /etc/systemd/journald.conf.d/10-sponsor.conf.
#
# Everything here was already true by default — the point is that it now says so. The box's journal is
# the ONLY record of what the sponsor spent DUST on: nothing is shipped off it, so "how far back can we
# look" is a decision, not something to discover during an incident.

[Journal]
# `auto` (the default) is persistent only *because* /var/log/journal happens to exist. If that directory
# ever went missing the journal would silently fall back to /run/log and every restart would erase the
# history — the failure mode being guarded here is a silent one.
Storage=persistent

# Whichever limit is reached first wins. The size cap is what protects the disk (the inherited default
# was 4 GB, being 10% of 125 GB capped); the time limit is the actual intent, and at this service's
# volume it is the one that should bind.
SystemMaxUse=1G
MaxRetentionSec=1year
