# Utility: Set up encryption password
#
# Creates a new encryption password during wallet setup.
# Enters the password twice (create + confirm).
#
# Uses a static test password that meets the requirement:
# - At least 10 characters
#
# Prerequisites:
# - Must be on the "Encryption Password" screen

appId: ${MAESTRO_APP_ID}
---

# Wait for password setup screen
- extendedWaitUntil:
    visible:
      id: "password-setup-input"
    timeout: 30000

# Enter password and press Enter to move to confirm field
- tapOn:
    id: "password-setup-input"
- inputText: "${WALLET_PASSWORD}"
- pressKey: Enter
- waitForAnimationToEnd

# Hide keyboard on iOS
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard

# Enter confirm password
- waitForAnimationToEnd
- tapOn:
    id: "password-setup-confirm-input"
- inputText: "${WALLET_PASSWORD}"
- pressKey: Enter

# Hide keyboard on iOS
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard

# Wait for UI to settle and tap submit
- waitForAnimationToEnd
- tapOn:
    id: "password-setup-submit-button"

# Wait for password to be processed
- waitForAnimationToEnd
