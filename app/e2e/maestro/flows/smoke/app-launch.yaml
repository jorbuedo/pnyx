# E2E Test: App Launch Smoke Test
#
# Basic smoke test to verify the app launches correctly.
# Uses the clear-and-launch utility which handles:
# - Dev client builds: Taps on Metro server in expo-dev-client to load the JS bundle
# - Standalone builds: Waits directly for the app's initial screen
#
# Tags: smoke
#
# Environment variables:
#   BUILD_TYPE: "standalone" for Maestro Cloud (no Metro), "devclient" for local dev (default)

appId: ${MAESTRO_APP_ID}
tags:
  - smoke
env:
  BUILD_TYPE: ${BUILD_TYPE}
---
# Clear state and launch app (handles dev client / standalone modes)
- runFlow: ../../utils/clear-and-launch.yaml

# Smoke test assertion: verify init screen loaded
# In dev client mode, clear-and-launch doesn't wait for app's init screen,
# so we need to wait here (standalone mode already waited in the utility)
- extendedWaitUntil:
    visible:
      id: "buttonContinue"
    timeout: 10000

- assertVisible:
    id: "buttonContinue"

# Take a screenshot for visual verification
- takeScreenshot: screenshots/app-launch-success
